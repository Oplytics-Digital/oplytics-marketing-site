<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="Oplytics.digital — Operational Excellence. One Digital Platform. Powered by AI.">
  <title>Oplytics.digital LinkedIn banner</title>
  <defs>
    <linearGradient id="oplytics-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C34E9"/>
      <stop offset="1" stop-color="#5B1FA6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#0D1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#8C34E9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8C34E9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#ground)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>

  <!-- Ghost target, right of centre (clear of the profile-logo overlap) -->
  <g transform="translate(1300 198)" opacity="0.16">
    <g fill="none" stroke="#8C34E9" stroke-width="6">
      <circle r="180"/>
      <circle r="128"/>
      <circle r="76"/>
    </g>
  </g>
  <g transform="translate(1300 198)" opacity="0.6">
    <circle cx="0" cy="0" r="7" fill="#1DB8CE"/>
    <circle cx="128" cy="-40" r="6" fill="#22C55E"/>
    <circle cx="-70" cy="110" r="6" fill="#F59E0B"/>
  </g>

  <!-- Mark -->
  <circle cx="150" cy="176" r="58" fill="url(#oplytics-purple)"/>
  <g fill="none" stroke="#0A0E1A" stroke-width="8">
    <circle cx="150" cy="176" r="34"/>
    <circle cx="150" cy="176" r="17"/>
  </g>
  <circle cx="167" cy="159" r="9" fill="#1DB8CE"/>

  <!-- Wordmark -->
  <text x="238" y="188" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="-1" fill="#E2E8F0">Oplytics<tspan font-weight="300" fill="#8890A0">.digital</tspan></text>

  <!-- Tagline -->
  <text x="240" y="234" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="21" letter-spacing="0.5" fill="#8890A0">Operational Excellence. One Digital Platform. Powered by AI.</text>

  <!-- Beta line -->
  <text x="240" y="300" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="2" fill="#1DB8CE">FREE BETA COHORT NOW OPEN &#160;&#183;&#160; OPLYTICS.DIGITAL/PITCH/BETA</text>
</svg>
