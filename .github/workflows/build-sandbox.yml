name: Build sandbox image

# Merging to `main` does NOT deploy to prod — prod is tag-gated (see
# deploy-vps.yml, which fires on `v*` tags). But the local MacBook sandbox
# needs a fresh image to pull after each merge, and `:latest` on GHCR now only
# moves on a release tag. So on every push to `main` we rebuild the site as
# `:sandbox` and push it. The sandbox pulls
# `ghcr.io/oplytics-digital/oplytics-marketing-site:sandbox`.
#
# Same build step as deploy-vps.yml's build-and-push job, minus the deploy job
# and minus the `:latest` / `:<sha>` / `:<tag>` tags — this image is
# sandbox-only and never reaches the VPS.

on:
  push:
    branches: [main]

concurrency:
  group: build-sandbox
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/oplytics-digital/oplytics-marketing-site:sandbox
