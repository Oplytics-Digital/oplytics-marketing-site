name: Build and deploy (VPS)

# Production deploys fire on a release TAG, never on a push to main.
# `main` is the integration branch (CI gates PRs); a release is:
#   git tag -a v2026.09.10 -m "..." && git push origin v2026.09.10
# See oplytics-policy-deployment#207 and its SANDBOX-PLAN.md.
on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-marketing-site-vps
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        # Docker tags must be lowercase; github.repository is "Oplytics-Digital/..."
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # `docker compose up -d` alone only compares compose config, not the
          # :latest digest, so a fresh :latest with unchanged config would not
          # recreate the container (see oplytics-portal's deploy.yml, hardened
          # after hitting exactly this in incident #152).
          script: |
            set -euo pipefail
            cd /opt/oplytics
            docker compose pull marketing-site
            docker compose up -d --pull always --force-recreate marketing-site

      - name: Verify the running build
        run: |
          set -euo pipefail
          url="https://oplyticsdigital.net/version.json"
          for i in $(seq 1 20); do
            commit=$(curl -fsS -m 10 "$url" | jq -r '.commit // empty' || true)
            if [ "$commit" = "${{ github.sha }}" ]; then
              echo "✅ Live build is $commit"
              exit 0
            fi
            echo "waiting for /version.json to report ${{ github.sha }} (got '${commit:-none}')…"
            sleep 15
          done
          echo "::error::Live /version.json never reported ${{ github.sha }} — deploy did not land"
          exit 1
